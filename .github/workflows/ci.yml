name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm curl qemu-system-x86 ovmf
      - name: Build the compiler (warnings are errors)
        run: make CFLAGS="-O2 -Wall -Werror"
      - name: Regression suite (the default build, where the compiler writes the ELF itself, no nasm and no ld for programs and -c objects; all tests and examples at -O0 and -O2, error messages, freestanding, align(N) fn, the --flat --axe2 header and layout, the QEMU kernel that runs a function at 0x9000, the --pe-efi PE32+ file read by a C checker and run by QEMU with OVMF (package ovmf at /usr/share/OVMF), the --flat --elf layout read by a C checker, -c linked with ld; CMP_REQUIRE=1 makes a missing qemu an error)
        run: CMP_REQUIRE=1 make test
      - name: Regression suite with --nasm (the old path, nasm and ld; -O0 and -O2, same golden files)
        run: make nasm-test
      - name: x86-64 encoder x64.c, assembler asm.c, ELF writer elf.c and -c objects (labels, jumps, call, sections, executable structure; objects compared with nasm's, linked with ld and gcc, run, read by readelf and objdump) against nasm -f elf64
        run: CMP_REQUIRE=1 make native-test
      - name: The --native ELF read by readelf and objdump (section headers, .symtab, FUNC/OBJECT symbols)
        run: CMP_REQUIRE=1 make native-readelf-test
      - name: .text of --native against nasm + ld (objcopy -O binary -j .text, cmp)
        run: CMP_REQUIRE=1 make native-text-test
      - name: Network test (simple_api_server + curl + Copihue HTTP clients)
        run: make net-test
      - name: Install instructions work
        run: |
          make install PREFIX=$HOME/.local
          cat > /tmp/hello.lap <<'LAP'
          fn main() -> i32 {
              println("Hello, Copihue!");
              return 0;
          }
          LAP
          cd /tmp && $HOME/.local/bin/copihue hello.lap -o hello && ./hello | grep -q "Hello, Copihue!"
      - name: Pure-assembly compiler smoke test
        run: |
          cd compiler/asm && ./build.sh
          ./chronos test_ultimate.chronos
          as -o out.o output.s && ld -o program out.o
          ./program | tee out.txt
          grep -q "= 20" out.txt
