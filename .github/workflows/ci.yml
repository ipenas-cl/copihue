name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm curl qemu-system-x86
      - name: Build the compiler (warnings are errors)
        run: make CFLAGS="-O2 -Wall -Werror"
      - name: Regression suite (all tests and examples at -O0 and -O2, error messages, freestanding)
        run: make test
      - name: x86-64 encoder against nasm (byte for byte)
        run: make native-test-x64enc
      - name: Network test (simple_api_server + curl + Copihue HTTP clients)
        run: make net-test
      - name: Install instructions work
        run: |
          make install PREFIX=$HOME/.local
          cat > /tmp/hello.lap <<'LAP'
          fn main() -> i32 {
              println("Hello, Copihue!");
              return 0;
          }
          LAP
          cd /tmp && $HOME/.local/bin/copihue hello.lap -o hello && ./hello | grep -q "Hello, Copihue!"
      - name: Pure-assembly compiler smoke test
        run: |
          cd compiler/asm && ./build.sh
          ./chronos test_ultimate.chronos
          as -o out.o output.s && ld -o program out.o
          ./program | tee out.txt
          grep -q "= 20" out.txt
