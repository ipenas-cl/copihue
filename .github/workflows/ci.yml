name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Build compiler, compile and run examples
        run: ./ci_examples.sh
      - name: Pure-assembly compiler smoke test
        run: |
          cd compiler/asm && ./build.sh
          ./chronos test_ultimate.chronos
          as -o out.o output.s && ld -o program out.o
          ./program | tee out.txt
          grep -q "= 20" out.txt
